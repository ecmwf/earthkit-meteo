name: ci

on:
  # Trigger the workflow on push to master or develop, except tag creation
  push:
    branches:
    - "main"
    - "develop"
    tags-ignore:
    - "**"
    paths-ignore:
    - "docs/**"
    - "README.md"

  # Trigger the workflow on pull request
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

  # Trigger the workflow manually
  workflow_dispatch:

  # Trigger after public PR approved for CI
  pull_request_target:
    types: [labeled]
    paths-ignore:
    - "docs/**"
    - "README.md"

jobs:
  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install and test
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"   # without optional dependencies
        pytest -q
        python -m pip install ".[all,test]"
        pytest -q

  # Run CI including downstream packages on self-hosted runners
  downstream-ci:
    name: downstream-ci
    needs: smoke-test
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci' }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci.yml@main
    with:
      earthkit-meteo: ecmwf/earthkit-meteo@${{ github.event.pull_request.head.sha || github.sha }}
      codecov_upload: true
      python_qa: false
    secrets: inherit

  # Build downstream packages on HPC
  downstream-ci-hpc:
    name: downstream-ci-hpc
    needs: smoke-test
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci' }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci-hpc.yml@main
    with:
      earthkit-meteo: ecmwf/earthkit-meteo@${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
